            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${AdTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${AdTableName}/index/*'

  EabuAdRequest:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: eabu-dish/eabu-advertisement-post
      Handler: app.lambda_handler
      Environment:
        Variables:
          AD_REQUEST_TABLE: !Ref AdTableName
          AD_PRODUCT_ID: !Ref AdProductId
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Scan          # the owner's paid ads (one paid ad per owner)
                - dynamodb:DeleteItem    # their unpaid drafts
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${AdTableName}'

  # Paid ads (Apple in-app subscription, $9.99 / 3 months, shown nationwide).
  EabuAdPurchaseFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: eabu-dish/eabu-ad-purchase
      Handler: app.lambda_handler
      Environment:
        Variables:
          AD_PRODUCT_ID: !Ref AdProductId
          APP_APPLE_ID: !Ref AppAppleId
          IAP_ALLOW_SANDBOX: !Ref IapAllowSandbox
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:UpdateItem
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${AdTableName}'

  # Extra posts: verifies an Apple purchase of the $0.99 pack and adds 15 posts.
  EabuPostCreditsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: eabu-dish/eabu-post-credits
      Handler: app.lambda_handler
      Environment:
        Variables:
          POSTS_PRODUCT_ID: !Ref PostsProductId
          APP_APPLE_ID: !Ref AppAppleId
          IAP_ALLOW_SANDBOX: !Ref IapAllowSandbox
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${PostCreditsTableName}'
            # Counts this month's free posts per category for the app.
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${EatProviderTableName}/index/userId-index'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LiveProviderTableName}/index/userId-index'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${MoveProviderTableName}/index/userId-index'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LifestyleProviderTableName}/index/userId-index'

  # Called by Apple (App Store Server Notifications V2), so its route has no Cognito authorizer.
  EabuAppleNotificationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: eabu-dish/eabu-apple-notifications
      Handler: app.lambda_handler
      Environment:
        Variables:
          AD_PRODUCT_ID: !Ref AdProductId
          POSTS_PRODUCT_ID: !Ref PostsProductId
          APP_APPLE_ID: !Ref AppAppleId
          IAP_ALLOW_SANDBOX: !Ref IapAllowSandbox
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:UpdateItem
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${AdTableName}'
            # A refunded extra-posts pack takes its posts back.
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${PostCreditsTableName}'

  # Daily: emails advertisers 5 days before their ad renews, hides lapsed paid ads.
  EabuAdReminderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: eabu-dish/eabu-ad-reminder
      Handler: app.lambda_handler
      Timeout: 60
      Events:
        Daily:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 14 * * ? *)   # 14:00 UTC = 9 or 10 am US Eastern
            Description: Paid ad renewal reminders
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:UpdateItem
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${AdTableName}'
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource:
                - !Sub 'arn:${AWS::Partition}:ses:${Region}:${AWS::AccountId}:identity/eabu.net'
                - !Sub 'arn:${AWS::Partition}:ses:${Region}:${AWS::AccountId}:identity/*@*'


  ProviderGetLifestyleFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: eabu-dish/provider-get-lifestyle
      Handler: app.lambda_handler
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LifestyleConsumerTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LifestyleConsumerTableName}/index/*'

  ProviderPostLifestyleFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: eabu-dish/provider-post-lifestyle
      Handler: app.lambda_handler
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Query
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LifestyleProviderTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LifestyleProviderTableName}/index/userId-index'
            # Past the free monthly limit a post spends an extra post (helpers.post_allowance).
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${PostCreditsTableName}'
            # The free posts are counted across all four seller tables.
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${EatProviderTableName}/index/userId-index'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LiveProviderTableName}/index/userId-index'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${MoveProviderTableName}/index/userId-index'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LifestyleProviderTableName}/index/userId-index'

  ConsumerPostLifestyleFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: eabu-dish/consumer-post-lifestyle
      Handler: app.lambda_handler
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LifestyleConsumerTableName}'

  ConsumerGetLifestyleFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: eabu-dish/consumer-get-lifestyle
      Handler: app.lambda_handler
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource:
                - !Sub 'arn:${AWS::Partition}:s3:::${IdentityBucketName}/listings/*'
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LifestyleProviderTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LifestyleProviderTableName}/index/*'

  LifestyleOfferFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: eabu-dish/provider-offer-lifestyle
      Handler: app.lambda_handler
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LifestyleOfferTableName}'
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LifestyleConsumerTableName}/index/*'
                # One offer per seller per request: look up existing offers on the request.
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LifestyleOfferTableName}/index/*'

  ConsumerReceivedLifestyleOfferFunction:
