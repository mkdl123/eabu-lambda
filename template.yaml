
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Eabu - a service
Globals:
  Function:
    Runtime: python3.12
    Layers:
    - Ref: SharedLayer
    Environment:
      Variables:
        REGION_NAME:
          Ref: Region
        EABU_FEEDBACK_TABLE_NAME:
          Ref: EabuFeedbackTableName
        EABU_DELETE_TABLE:
          Ref: EabuDeleteTableName
        EABU_SERVICE_REQUEST_TABLE:
          Ref: EabuServiceRequestTableName
        EABU_USER_TABLE_NAME:
          Ref: EabuUserTableName
        EAT_INTERESTED_TABLE_NAME:
          Ref: EatInterestedTableName
        LIVE_INTERESTED_TABLE_NAME:
          Ref: LiveInterestedTableName
        MOVE_INTERESTED_TABLE_NAME:
          Ref: MoveInterestedTableName
        EABU_IDENTITY_TABLE_NAME:
          Ref: EabuIdentityTableName
        EAT_CONSUMER_TABLE_NAME:
          Ref: EatConsumerTableName
        LIVE_CONSUMER_TABLE_NAME:
          Ref: LiveConsumerTableName
        MOVE_CONSUMER_TABLE_NAME:
          Ref: MoveConsumerTableName
        EAT_PROVIDER_TABLE_NAME:
          Ref: EatProviderTableName
        LIVE_PROVIDER_TABLE_NAME:
          Ref: LiveProviderTableName
        MOVE_PROVIDER_TABLE_NAME:
          Ref: MoveProviderTableName
        EAT_OFFER_TABLE_NAME:
          Ref: EatOfferTableName
        LIVE_OFFER_TABLE_NAME:
          Ref: LiveOfferTableName
        MOVE_OFFER_TABLE_NAME:
          Ref: MoveOfferTableName
        AD_TABLE_NAME:
          Ref: AdTableName
        AD_TABLE_REQ:
          Ref: AdTableReqName
        FOLLOWERS_TABLE_NAME:
          Ref: FollowersTableName
        NOTIFICATION_FUNCTION_ARN:
          Ref: NotificationFunctionArn
    MemorySize: 256
    Timeout: 30

Parameters:
  NotificationFunctionArn:
    Type: String
  xApiKey:
    Type: String
    NoEcho: true

  NotificationFunctionName:
    Type: String
    Default: EabuNotificationFunction

  EabuFeedbackTableName:
    Type: String
    Default: eabu-feedback

  EabuDeleteTableName:
    Type: String
    Default: eabu-delete

  EabuServiceRequestTableName:
    Type: String
    Default: eabu-service-request

  EabuUserTableName:
    Type: String
    Default: eabu-users

  FollowersTableName:
    Type: String
    Default: eabu-followers

  AdTableReqName:
    Type: String
    Default: eabu-ad-req

  AdTableName:
    Type: String
    Default: eabu-advertisement

  MoveOfferTableName:
    Type: String
    Default: eabu-move-offer
  LiveOfferTableName:
    Type: String
    Default: eabu-live-offer
  EatOfferTableName:
    Type: String
    Default: eabu-eat-offer

  EatInterestedTableName:
    Type: String
    Default: eabu-eat-interested
  LiveInterestedTableName:
    Type: String
    Default: eabu-live-interested
  MoveInterestedTableName:
    Type: String
    Default: eabu-move-interested
  EabuIdentityTableName:
    Type: String
    Default: eabu-identity
  EatConsumerTableName:
    Type: String
    Default: eabu-eat-consumer
  LiveConsumerTableName:
    Type: String
    Default: eabu-live-consumer
  MoveConsumerTableName:
    Type: String
    Default: eabu-move-consumer
  EatProviderTableName:
    Type: String
    Default: eabu-eat-provider
  LiveProviderTableName:
    Type: String
    Default: eabu-live-provider
  MoveProviderTableName:
    Type: String
    Default: eabu-move-provider
  Region:
    Type: String
    Default: us-east-1

Resources:
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: shared-utils
      Description: Common helpers and resources for all functions
      ContentUri: eabu-dish
      CompatibleRuntimes:
        - python3.12

  EabuFeedbackSubmitFunctionName:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: eabu-dish/eabu-feedback-submit
      Handler: app.lambda_handler

  EabuFeedbackFormFunctionName:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: eabu-dish/eabu-feedback-form
      Handler: app.lambda_handler

  EabuHomePageFunctionName:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
