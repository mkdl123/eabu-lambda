
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Eabu - a service
Globals:
  Function:
    Runtime: python3.12
    Layers:
    - Ref: SharedLayer
    Environment:
      Variables:
        REGION_NAME:
          Ref: Region
        POST_CREDITS_TABLE_NAME:
          Ref: PostCreditsTableName
        EABU_FEEDBACK_TABLE_NAME:
          Ref: EabuFeedbackTableName
        EABU_DELETE_TABLE:
          Ref: EabuDeleteTableName
        EABU_SERVICE_REQUEST_TABLE:
          Ref: EabuServiceRequestTableName
        EAT_INTERESTED_TABLE_NAME:
          Ref: EatInterestedTableName
        LIVE_INTERESTED_TABLE_NAME:
          Ref: LiveInterestedTableName
        MOVE_INTERESTED_TABLE_NAME:
          Ref: MoveInterestedTableName
        EABU_IDENTITY_TABLE_NAME:
          Ref: EabuIdentityTableName
        EAT_CONSUMER_TABLE_NAME:
          Ref: EatConsumerTableName
        LIVE_CONSUMER_TABLE_NAME:
          Ref: LiveConsumerTableName
        MOVE_CONSUMER_TABLE_NAME:
          Ref: MoveConsumerTableName
        EAT_PROVIDER_TABLE_NAME:
          Ref: EatProviderTableName
        LIVE_PROVIDER_TABLE_NAME:
          Ref: LiveProviderTableName
        MOVE_PROVIDER_TABLE_NAME:
          Ref: MoveProviderTableName
        EAT_OFFER_TABLE_NAME:
          Ref: EatOfferTableName
        LIVE_OFFER_TABLE_NAME:
          Ref: LiveOfferTableName
        MOVE_OFFER_TABLE_NAME:
          Ref: MoveOfferTableName
        AD_TABLE_NAME:
          Ref: AdTableName
        AUTH_MODE:
          Ref: AuthMode
        AD_PUBLIC_STATUSES:
          Ref: AdPublicStatuses
        EAT_RATED_TABLE_NAME:
          Ref: EatRatedTableName
        LIVE_RATED_TABLE_NAME:
          Ref: LiveRatedTableName
        MOVE_RATED_TABLE_NAME:
          Ref: MoveRatedTableName
        LIFESTYLE_CONSUMER_TABLE_NAME:
          Ref: LifestyleConsumerTableName
        LIFESTYLE_PROVIDER_TABLE_NAME:
          Ref: LifestyleProviderTableName
        LIFESTYLE_OFFER_TABLE_NAME:
          Ref: LifestyleOfferTableName
        LIFESTYLE_INTERESTED_TABLE_NAME:
          Ref: LifestyleInterestedTableName
        LIFESTYLE_RATED_TABLE_NAME:
          Ref: LifestyleRatedTableName
        FAVOURITES_TABLE_NAME:
          Ref: FavouritesTableName
        IDENTITY_BUCKET_NAME:
          Ref: IdentityBucketName
        SENDER_EMAIL:
          Ref: SenderEmail
        AUTH_USER_ID_CLAIM:
          Ref: AuthUserIdClaim
    MemorySize: 256
    # API Gateway gives up after 29 s anyway; a shorter limit stops a stuck function billing.
    Timeout: 10
    # Graviton: 20% cheaper per GB-second than x86, and builds natively on Apple-silicon Macs.
    Architectures:
      - arm64

Parameters:
  AuthMode:
    Type: String
    Default: "enforce"
    AllowedValues: ["off", "enforce"]
    Description: >-
      "off" logs requests that would be rejected (rollout mode); "enforce" rejects
      requests without a valid Cognito identity matching the userId they act on.
      Requires a Cognito authorizer on the API Gateway methods.
  AdPublicStatuses:
    Type: String
    Default: active,approved,published
    Description: Comma-separated ad statuses that may be listed publicly (case-insensitive).
  AuthUserIdClaim:
    Type: String
    Default: "cognito:username"
    Description: Cognito claim that holds the app's userId (usually "sub" or "cognito:username").
  AdProductId:
    Type: String
    Default: net.eabu.app.ad.quarterly
    Description: App Store product id of the $9.99 / 3-month ad subscription.
  PostsProductId:
    Type: String
    Default: net.eabu.app.posts15
    Description: App Store product id of the $0.99 consumable that adds 15 extra posts.
  PostCreditsTableName:
    Type: String
    Default: eabu-post-credits
    Description: Each seller's extra-post balance and the Apple transactions already credited (created by scripts/create-post-credits-table.sh).
  AppAppleId:
    Type: String
    Default: "6833603481"
    Description: The app's numeric Apple ID (App Store Connect > App Information). Needed to verify App Store (production) purchases.
  IapAllowSandbox:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Accept sandbox purchases too. Keep "true", since TestFlight and App Review buy in the sandbox.

  EabuFeedbackTableName:
    Type: String
    Default: eabu-feedback

  EabuDeleteTableName:
    Type: String
    Default: eabu-delete

  EabuServiceRequestTableName:
    Type: String
    Default: eabu-service-request

  AdTableName:
    Type: String
    Default: eabu-advertisement

  MoveOfferTableName:
    Type: String
    Default: eabu-move-offer
  LiveOfferTableName:
    Type: String
    Default: eabu-live-offer
  EatOfferTableName:
    Type: String
    Default: eabu-eat-offer

  EatInterestedTableName:
    Type: String
    Default: eabu-eat-interested
  LiveInterestedTableName:
    Type: String
    Default: eabu-live-interested
  MoveInterestedTableName:
    Type: String
    Default: eabu-move-interested
  EabuIdentityTableName:
    Type: String
    Default: eabu-identity
  EatConsumerTableName:
    Type: String
    Default: eabu-eat-consumer
  LiveConsumerTableName:
    Type: String
    Default: eabu-live-consumer
  MoveConsumerTableName:
    Type: String
    Default: eabu-move-consumer
  EatProviderTableName:
    Type: String
    Default: eabu-eat-provider
  LiveProviderTableName:
    Type: String
    Default: eabu-live-provider
  MoveProviderTableName:
    Type: String
    Default: eabu-move-provider
  Region:
    Type: String
    Default: us-east-1
  EatRatedTableName:
    Type: String
    Default: eabu-eat-rated
  LiveRatedTableName:
    Type: String
    Default: eabu-live-rated
  MoveRatedTableName:
    Type: String
    Default: eabu-move-rated
  LifestyleConsumerTableName:
    Type: String
    Default: eabu-lifestyle-consumer
  LifestyleProviderTableName:
    Type: String
    Default: eabu-lifestyle-provider
  LifestyleOfferTableName:
    Type: String
    Default: eabu-lifestyle-offer
  LifestyleInterestedTableName:
    Type: String
    Default: eabu-lifestyle-interested
  LifestyleRatedTableName:
    Type: String
    Default: eabu-lifestyle-rated
  FavouritesTableName:
    Type: String
    Default: eabu-favourites
  IdentityBucketName:
    Type: String
    Default: eabu-identity-pictures
  SenderEmail:
    Type: String
    Default: eabu@eabu.net

  UserPoolId:
    Type: String
    Default: us-east-1_G0VobzUMd
    Description: Cognito user pool the app signs in with (account deletion removes users from it).

Resources:
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: shared-utils
      Description: Common helpers and resources for all functions
      ContentUri: eabu-dish
      CompatibleRuntimes:
        - python3.12
      CompatibleArchitectures:
        - arm64

  EabuFeedbackSubmitFunctionName:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: eabu-dish/eabu-feedback-submit
      Handler: app.lambda_handler
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${EabuFeedbackTableName}'

  EabuFeedbackFormFunctionName:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: eabu-dish/eabu-feedback-form
      Handler: app.lambda_handler
      # No AWS service access needed (role keeps only CloudWatch Logs).

  EabuHomePageFunctionName:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: eabu-dish/eabu-home
      Handler: app.lambda_handler
      # No AWS service access needed (role keeps only CloudWatch Logs).

  EabuDeleteUserInfoFunctionName:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: eabu-dish/eabu-delete-user-info
      Handler: app.lambda_handler
      # Deleting an account touches every table; give it room beyond the 10-second default.
      Timeout: 60
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPoolId
      Policies:
        - Version: '2012-10-17'
          Statement:
            # Account deletion (Delete Account in the app): find and remove the user's rows everywhere.
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:DeleteItem
                - dynamodb:BatchWriteItem
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${EatConsumerTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${EatProviderTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${EatOfferTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${EatInterestedTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${EatRatedTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LiveConsumerTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LiveProviderTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LiveOfferTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LiveInterestedTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LiveRatedTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${MoveConsumerTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${MoveProviderTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${MoveOfferTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${MoveInterestedTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${MoveRatedTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LifestyleConsumerTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LifestyleProviderTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LifestyleOfferTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LifestyleInterestedTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LifestyleRatedTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${FavouritesTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${AdTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${PostCreditsTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${EabuIdentityTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${EabuServiceRequestTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${EabuFeedbackTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${EabuDeleteTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${EatConsumerTableName}/index/*'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${EatProviderTableName}/index/*'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${EatOfferTableName}/index/*'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LiveConsumerTableName}/index/*'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LiveProviderTableName}/index/*'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LiveOfferTableName}/index/*'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${MoveConsumerTableName}/index/*'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${MoveProviderTableName}/index/*'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${MoveOfferTableName}/index/*'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LifestyleConsumerTableName}/index/*'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LifestyleProviderTableName}/index/*'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LifestyleOfferTableName}/index/*'
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${EabuDeleteTableName}'
            # Purchase records are kept but unlinked from the deleted user.
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${PostCreditsTableName}'
            - Effect: Allow
              Action:
                - s3:DeleteObject
              Resource:
                - !Sub 'arn:${AWS::Partition}:s3:::${IdentityBucketName}/listings/*'
                - !Sub 'arn:${AWS::Partition}:s3:::${IdentityBucketName}/*/profile.jpg'
            - Effect: Allow
              Action:
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminDeleteUser
              Resource:
                - !Sub 'arn:${AWS::Partition}:cognito-idp:${Region}:${AWS::AccountId}:userpool/${UserPoolId}'

  EabuConsumerRepostFuctionName:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: eabu-dish/consumer-repost
      Handler: app.lambda_handler
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${EatConsumerTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LiveConsumerTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LifestyleConsumerTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${MoveConsumerTableName}'
  EabuServiceRequestFunctionName:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: eabu-dish/eabu-service-request
      Handler: app.lambda_handler
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${EabuServiceRequestTableName}'
  EabuProviderRepostFuctionName:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: eabu-dish/provider-repost
      Handler: app.lambda_handler
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${EatProviderTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${EatProviderTableName}/index/userId-index'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LiveProviderTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LiveProviderTableName}/index/userId-index'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LifestyleProviderTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LifestyleProviderTableName}/index/userId-index'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${MoveProviderTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${MoveProviderTableName}/index/userId-index'
            # A repost copies the listing's pictures onto themselves to restart their 60-day expiry.
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource:
                - !Sub 'arn:${AWS::Partition}:s3:::${IdentityBucketName}/listings/*'
            # Past the free monthly limit a post spends an extra post (helpers.post_allowance).
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${PostCreditsTableName}'
            # The free posts are counted across all four seller tables.
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${EatProviderTableName}/index/userId-index'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LiveProviderTableName}/index/userId-index'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${MoveProviderTableName}/index/userId-index'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LifestyleProviderTableName}/index/userId-index'

  EabuCheckUserInterestedFunctionName:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: eabu-dish/eabu-check-interested
      Handler: app.lambda_handler
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${EatInterestedTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LiveInterestedTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LifestyleInterestedTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${MoveInterestedTableName}'

  EabuPostUserInterestedFunctionName:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: eabu-dish/eabu-update-interested
      Handler: app.lambda_handler
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:DeleteItem
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${EatInterestedTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LiveInterestedTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LifestyleInterestedTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${MoveInterestedTableName}'
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${EatProviderTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LiveProviderTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LifestyleProviderTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${MoveProviderTableName}'

  EabuGetUserRatingsFunctionName:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: eabu-dish/eabu-get-user-ratings
      Handler: app.lambda_handler
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${EatProviderTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${EatProviderTableName}/index/*'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LiveProviderTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LifestyleProviderTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LiveProviderTableName}/index/*'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LifestyleProviderTableName}/index/*'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${MoveProviderTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${MoveProviderTableName}/index/*'

  EabuUpdateRatingsFunctionName:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: eabu-dish/eabu-update-ratings
      Handler: app.lambda_handler
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:DeleteItem
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${EatRatedTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LiveRatedTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LifestyleRatedTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${MoveRatedTableName}'
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${EatProviderTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LiveProviderTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LifestyleProviderTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${MoveProviderTableName}'
  EabuUserFunctionName:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: eabu-dish/eabu-user
      Handler: app.lambda_handler
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource:
