            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${EatProviderTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${EatProviderTableName}/index/*'

  EabuProfilePictureFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      # Optional profile picture: POST /profile-picture uploads or replaces it,
      # DELETE /profile-picture/{userId} removes it.
      CodeUri: eabu-dish/eabu-profile-picture
      Handler: app.lambda_handler
      Timeout: 30  # resizing pictures with Pillow can take a few seconds
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:DeleteObject
              Resource:
                - !Sub 'arn:${AWS::Partition}:s3:::${IdentityBucketName}/*/profile.jpg'
            - Effect: Allow
              Action:
                - rekognition:DetectModerationLabels  # nudity check before saving (content_filter)
              Resource: '*'  # this action has no resource-level permissions

  EabuListingPictureFunction:
    Type: AWS::Serverless::Function
    Properties:
      # Up to four pictures per seller listing: POST /listing-picture uploads or replaces
      # a slot, DELETE /listing-picture/{category}/{zipcode}/{itemId}/{slot} removes it.
      CodeUri: eabu-dish/eabu-listing-picture
      Handler: app.lambda_handler
      Timeout: 30  # resizing pictures with Pillow can take a few seconds
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:DeleteObject
              Resource:
                - !Sub 'arn:${AWS::Partition}:s3:::${IdentityBucketName}/listings/*'
                - !Sub 'arn:${AWS::Partition}:s3:::${IdentityBucketName}/ads/*'
            - Effect: Allow
              Action:
                - rekognition:DetectModerationLabels  # nudity check before saving (content_filter)
              Resource: '*'  # this action has no resource-level permissions
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${AdTableName}'   # ad pictures
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${EatProviderTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LiveProviderTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${MoveProviderTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LifestyleProviderTableName}'

  EabuFavouritesFunction:
    Type: AWS::Serverless::Function
    Properties:
      # Favourite sellers/buyers: list, add, remove, and a feed of their current posts.
      CodeUri: eabu-dish/eabu-favourites
      Handler: app.lambda_handler
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow   # per-user hourly read limit
              Action:
                - dynamodb:UpdateItem
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${RateLimitTableName}'
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:PutItem
                - dynamodb:DeleteItem
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${FavouritesTableName}'
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${EatProviderTableName}/index/userId-index'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LiveProviderTableName}/index/userId-index'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${MoveProviderTableName}/index/userId-index'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LifestyleProviderTableName}/index/userId-index'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${EatConsumerTableName}/index/userId-index'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LiveConsumerTableName}/index/userId-index'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${MoveConsumerTableName}/index/userId-index'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LifestyleConsumerTableName}/index/userId-index'
            - Effect: Allow
              Action:
                - dynamodb:Scan   # nearby feed: recent posts within 50 miles
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${EatProviderTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LiveProviderTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${MoveProviderTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LifestyleProviderTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${EatConsumerTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LiveConsumerTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${MoveConsumerTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LifestyleConsumerTableName}'
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource:
                - !Sub 'arn:${AWS::Partition}:s3:::${IdentityBucketName}/listings/*'
            - Effect: Allow   # /guest/zip in India: position -> PIN code (not stored)
              Action:
                - geo:SearchPlaceIndexForPosition
              Resource:
                - !Sub 'arn:${AWS::Partition}:geo:${Region}:${AWS::AccountId}:place-index/placeIndex43161903-dev'

  EabuAdvertisement:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: eabu-dish/eabu-advertisement-get
      Handler: app.lambda_handler
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow   # per-user hourly read limit
              Action:
                - dynamodb:UpdateItem
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${RateLimitTableName}'
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${AdTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${AdTableName}/index/*'
            - Effect: Allow
              Action:
                - s3:GetObject   # ad picture links
              Resource:
                - !Sub 'arn:${AWS::Partition}:s3:::${IdentityBucketName}/ads/*'

  EabuAdRequest:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: eabu-dish/eabu-advertisement-post
      Handler: app.lambda_handler
      Environment:
        Variables:
          AD_REQUEST_TABLE: !Ref AdTableName
          AD_PRODUCT_ID: !Ref AdProductId
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Scan          # the owner's paid ads (one paid ad per owner)
                - dynamodb:GetItem       # free-ad markers left by deleted accounts
                - dynamodb:DeleteItem    # their unpaid drafts
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${AdTableName}'

  # Paid ads (Apple in-app subscription, $9.99 / 3 months, shown nationwide).
  EabuAdPurchaseFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: eabu-dish/eabu-ad-purchase
      Handler: app.lambda_handler
      Environment:
        Variables:
          AD_PRODUCT_ID: !Ref AdProductId
          APP_APPLE_ID: !Ref AppAppleId
          IAP_ALLOW_SANDBOX: !Ref IapAllowSandbox
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:GetItem       # free-ad markers (firstAdFree)
                - dynamodb:UpdateItem
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${AdTableName}'
            - Effect: Allow
              Action:
                - s3:GetObject   # ad picture links
              Resource:
                - !Sub 'arn:${AWS::Partition}:s3:::${IdentityBucketName}/ads/*'

  # Extra posts: verifies an Apple purchase of the $0.99 pack and adds 15 posts.
  EabuPostCreditsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: eabu-dish/eabu-post-credits
      Handler: app.lambda_handler
      Environment:
        Variables:
          POSTS_PRODUCT_ID: !Ref PostsProductId
          APP_APPLE_ID: !Ref AppAppleId
          IAP_ALLOW_SANDBOX: !Ref IapAllowSandbox
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${PostCreditsTableName}'
            # Counts this month's free posts per category for the app.
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${EatProviderTableName}/index/userId-index'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LiveProviderTableName}/index/userId-index'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${MoveProviderTableName}/index/userId-index'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LifestyleProviderTableName}/index/userId-index'

  # Called by Apple (App Store Server Notifications V2), so its route has no Cognito authorizer.
  EabuAppleNotificationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: eabu-dish/eabu-apple-notifications
      Handler: app.lambda_handler
      Environment:
        Variables:
          AD_PRODUCT_ID: !Ref AdProductId
          POSTS_PRODUCT_ID: !Ref PostsProductId
          APP_APPLE_ID: !Ref AppAppleId
          IAP_ALLOW_SANDBOX: !Ref IapAllowSandbox
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:UpdateItem
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${AdTableName}'
            # A refunded extra-posts pack takes its posts back.
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${PostCreditsTableName}'

  # Report a post, request, offer, ad or profile (App Store guideline 1.2): saved + emailed for review.
  EabuReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: eabu-dish/eabu-report
      Handler: app.lambda_handler
      Environment:
        Variables:
          REPORT_EMAIL: !Ref ReportEmail
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${EabuFeedbackTableName}'
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource:
                - !Sub 'arn:${AWS::Partition}:ses:${Region}:${AWS::AccountId}:identity/eabu.net'

  # Daily: emails advertisers 5 days before their ad renews, hides lapsed paid ads.
  EabuAdReminderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: eabu-dish/eabu-ad-reminder
      Handler: app.lambda_handler
      Timeout: 60
      Events:
        Daily:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 14 * * ? *)   # 14:00 UTC = 9 or 10 am US Eastern
            Description: Paid ad renewal reminders
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:UpdateItem
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${AdTableName}'
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource:
                - !Sub 'arn:${AWS::Partition}:ses:${Region}:${AWS::AccountId}:identity/eabu.net'
                - !Sub 'arn:${AWS::Partition}:ses:${Region}:${AWS::AccountId}:identity/*@*'


  # Mondays: top-rated places per area with Claude + Ticketmaster events (one async run per area).
  EabuDiscoverFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: eabu-dish/eabu-discover
      Handler: app.lambda_handler
      Timeout: 600   # one area: about 2-5 minutes of searching (8 food + 4 x 3 Lifestyle places)
      Environment:
        Variables:
          DISCOVERED_TABLE_NAME: !Ref DiscoveredTableName
          DISCOVER_MAX_AREAS: !Ref DiscoverMaxAreas
      EventInvokeConfig:
        MaximumRetryAttempts: 1   # a failed area tries once more, then waits for next week
      Events:
        Weekly:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 10 ? * MON *)   # 10:00 UTC Monday = 5 or 6 am US Eastern
            Description: Discovered near you (weekly top-rated places and events)
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow   # which ZIPs have posts (ZIP only)
              Action:
                - dynamodb:Scan
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${EatConsumerTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${EatProviderTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LiveConsumerTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LiveProviderTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${MoveConsumerTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${MoveProviderTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LifestyleConsumerTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${LifestyleProviderTableName}'
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:BatchWriteItem
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${DiscoveredTableName}'
            - Effect: Allow   # the Claude and Ticketmaster API keys (SecureString, AWS-managed key)
              Action:
                - ssm:GetParameter
              Resource:
                - !Sub 'arn:${AWS::Partition}:ssm:${Region}:${AWS::AccountId}:parameter/eabu/anthropic-api-key'
                - !Sub 'arn:${AWS::Partition}:ssm:${Region}:${AWS::AccountId}:parameter/eabu/ticketmaster-api-key'
            - Effect: Allow   # starts itself once per area
              Action:
                - lambda:InvokeFunction
              Resource:
                - !Sub 'arn:${AWS::Partition}:lambda:${Region}:${AWS::AccountId}:function:${AWS::StackName}-EabuDiscoverFunction-*'

  # GET /discovered?zip= : this week's finds for the caller's area.
  EabuDiscoveredFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: eabu-dish/eabu-discovered
      Handler: app.lambda_handler
      Environment:
        Variables:
          DISCOVERED_TABLE_NAME: !Ref DiscoveredTableName
          DISCOVER_FUNCTION_NAME: !Ref EabuDiscoverFunction
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow   # per-user hourly read limit
              Action:
                - dynamodb:UpdateItem
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${RateLimitTableName}'
            - Effect: Allow   # read finds; record views; create a new area (+ daily cap counter)
              Action:
                - dynamodb:Scan
                - dynamodb:Query
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${Region}:${AWS::AccountId}:table/${DiscoveredTableName}'
            - Effect: Allow   # first search for a new area
              Action:
                - lambda:InvokeFunction
              Resource:
                - !GetAtt EabuDiscoverFunction.Arn

