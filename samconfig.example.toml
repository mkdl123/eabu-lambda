# More information about the configuration file can be found here:
# https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-cli-config.html
version = 0.1

[default.global.parameters]
stack_name = "eabulambda"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true


[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
s3_prefix = "eabulambda"
region = "us-east-1"
#disable_rollback = true
image_repositories = []
parameter_overrides = "AuthMode=\"enforce\" AuthUserIdClaim=\"cognito:username\" NotificationFunctionArn=\"<NOTIFICATION_FUNCTION_ARN>\" NotificationFunctionName=\"EabuNotificationFunction\" EabuUserTableName=\"eabu-users\" FollowersTableName=\"eabu-followers\" AdTableReqName=\"eabu-ad-req\" AdTableName=\"eabu-advertisement\" EatInterestedTableName=\"eabu-eat-interested\" LiveInterestedTableName=\"eabu-live-interested\" MoveInterestedTableName=\"eabu-move-interested\" MoveOfferTableName=\"eabu-move-offer\" LiveOfferTableName=\"eabu-live-offer\" EatOfferTableName=\"eabu-eat-offer\" EabuIdentityTableName=\"eabu-identity\" EatConsumerTableName=\"eabu-eat-consumer\" LiveConsumerTableName=\"eabu-live-consumer\" MoveConsumerTableName=\"eabu-move-consumer\" EatProviderTableName=\"eabu-eat-provider\" LiveProviderTableName=\"eabu-live-provider\" MoveProviderTableName=\"eabu-move-provider\" Region=\"us-east-1\""
disable_rollback = false

[default.package.parameters]
resolve_s3 = true

[default.sync.parameters]
watch = true

[default.local_start_api.parameters]
warm_containers = "EAGER"

[default.local_start_lambda.parameters]
warm_containers = "EAGER"
